schema_version: 1
source_of_truth:
  manuscript: paper/main.tex
  notation: paper/defs.tex
specialization:
  phases:
  - deformable solid
  - water
  configuration: solid reference
  balances_and_closures:
  - solid partial-density conservation in spatial form
  - matched logarithmic drained skeleton and mechanical mineral stress laws
  - scalar mineral equation from pressure equilibrium of the distention and mineral energy
  - barotropic water equation of state
  discretization:
    displacement: Q2 continuous Lagrange
    water_pressure: Q1 continuous Lagrange
    solid_spatial_mass: Q2 continuous Lagrange
    pressure_enrichment: false
implementation:
  solid_mass_storage:
    objects:
    - ADBinarySolidSpatialMassMaterial
    - ADReferenceMaterialStorageRateTerm
    role: solve the pulled-back spatial solid mass balance d(J rho_s)/dt=0
  local_mineral_state:
    objects:
    - ADLocalElasticMineralBiotMaterial
    - ADConstrainedSkeletonBiotMaterial
    role: solve the matched logarithmic mineral residual and evaluate the production
      closed-form coefficient at the converged state; independently solve the general
      two-state tangent at fixed pore pressure and fixed referential mass for verification
    shared_solver: moose_app/include/utils/MatchedLogMineralState.h
    ad_dependencies: retain mineral-state dependence on deformation and pressure in the outer Jacobian
  water_mass_storage:
    objects:
    - ADBiotPressureStorageMaterial
    - ADReferenceMaterialStorageRateTerm
    role: calculate the complete chain-rule time rate of the pulled-back water accumulation J(1-phi_s)rho_f(p)
      from AD time-integrator rates and assemble it with an AD time kernel, with rho_f supplied by the
      barotropic water equation of state and no prescribed Biot storage modulus
  darcy_flux:
    object: ADBiotDarcyReferenceFluxMaterial
    role: pull the Q1 pressure-gradient Darcy mass flux to the solid reference configuration
  total_stress:
    object: ADReferenceSolidStressMaterial
    role: apply the nonlinear Biot pressure contribution to the first Piola stress
  prescribed_deformation_helper:
    object: ADConstantDeformationGradientMaterial
    role: homogeneous deformation with AD axial stretch and optional superposed rotation
  implicit_poroplastic:
    object: ADImplicitPoroplasticBiotMaterial
    role: solve current symmetric exponential flow increment and yield consistency, recomputing the mass-conserving
      matched logarithmic mineral state and state-only coefficient at fixed pore pressure and
      current plastic state; retain the current plastic-state dependence in outer AD derivatives
    scope: homogeneous constitutive verification; active coupled fluid storage remains unverified
evidence:
  local_elastic_tangent: validation/mandel_implicit_biot.yml
  outer_ad_jacobian: moose_app/test/tests/mandel_implicit_biot/implicit_biot_q2_q1_jacobian.i
  analytical_mandel: validation/mandel_pressure_profiles.csv
  analytical_displacements: validation/mandel_displacement_profiles.csv
  finite_deformation_biot: validation/mandel_large_deformation.csv
  finite_deformation_biot_field: validation/mandel_biot_contours.csv
  finite_deformation_density_field: validation/mandel_density_contours.csv
  implicit_poroplastic: validation/implicit_poroplastic_verification.json
  plastic_history: validation/implicit_poroplastic_history.csv
  plastic_feedback: validation/implicit_poroplastic_feedback.csv
classification:
  implementation_verification:
  - solid_spatial_mass_balance
  - local_elastic_tangent
  - outer_ad_jacobian
  - implicit_poroplastic
  analytical_benchmark:
  - analytical_mandel
  - analytical_displacements
  synthetic_discrimination:
  - finite_deformation_biot
  - finite_deformation_biot_field
  - finite_deformation_density_field
  - plastic_history
  - plastic_feedback
  independent_physical_validation: []
legacy_audit: validation/manuscript_constitutive_audit_2026-09-08.md
