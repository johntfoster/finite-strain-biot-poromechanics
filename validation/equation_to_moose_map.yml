schema_version: 1
scope: single-solid single-water finite-deformation Biot coefficient

mappings:
  - id: solid_kinematics
    paper_equations: [eq:skeleton-kinematics]
    moose_objects: [ADSolidReferenceKinematics]
    tests: [mandel_water_q2_q1_smoke, mandel_water_q2_q1_verification]

  - id: solid_spatial_mass_balance
    paper_equations: [eq:spatial-solid-mass-balance, eq:reference-solid-mass-balance, eq:solid-mass-weak-residual]
    moose_objects: [ADBinarySolidSpatialMassMaterial, ADReferenceMaterialStorageRateTerm]
    variables: [Q2 solid partial density stored in reference-normalized form]
    tests: [mandel_water_q2_q1_smoke, mandel_water_q2_q1_bdf2, mandel_water_q2_q1_verification, mandel_water_q2_q1_jacobian]

  - id: local_mineral_state
    paper_equations: [eq:general-local-constitutive-system, eq:local-material-mass-constraint, eq:elastic-local-constraints, eq:elastic-mineral-density]
    moose_objects: [ADLocalElasticMineralBiotMaterial]
    outputs: [elastic intrinsic solid density stored in reference-normalized form, solid volume fraction, material rates, constraint residuals and partial derivatives, closed-form Biot oracle]
    tests: [mandel_water_q2_q1_verification, mandel_water_q2_q1_jacobian]

  - id: fixed_pressure_biot_tangent
    paper_equations: [eq:finite-deformation-biot-coefficient, eq:implicit-local-state-tangent, eq:constrained-mineral-jacobian-tangent, eq:general-implicit-biot-coefficient, eq:elastic-local-residual-jacobian, eq:elastic-finite-deformation-biot-coefficient]
    moose_objects: [ADConstrainedSkeletonBiotMaterial, ADLocalElasticMineralBiotMaterial]
    production_output: ADConstrainedSkeletonBiotMaterial supplies solid_biot_coefficient from the dense AD-valued implicit tangent
    verification_oracle: ADLocalElasticMineralBiotMaterial supplies elastic_biot_closed_form under a separate property name
    tests: [mandel_water_q2_q1_verification, mandel_water_q2_q1_jacobian]

  - id: stress_and_momentum
    paper_equations: [eq:total-first-piola-stress, eq:momentum-weak-residual]
    moose_objects: [ADVolumetricBarotropicSkeletonStressMaterial, ADReferenceSolidStressMaterial, ADReferenceSolidMomentum]
    tests: [mandel_water_q2_q1_smoke, mandel_water_q2_q1_jacobian]

  - id: water_mass_balance
    paper_equations: [eq:reference-water-mass-balance, eq:barotropic-water-density, eq:water-pressure-weak-residual]
    moose_objects: [ADBiotPressureStorageMaterial, ADReferenceMaterialStorageRateTerm]
    time_discretization: AD time kernel using pressure, solid-volume-fraction, and displacement-gradient rates supplied by the selected MOOSE time integrator
    tests: [mandel_water_q2_q1_bdf2, mandel_water_q2_q1_verification, mandel_water_q2_q1_jacobian]

  - id: water_darcy_flux
    paper_equations: [eq:reference-darcy-flux, eq:water-pressure-weak-residual]
    moose_objects: [ADBiotDarcyReferenceFluxMaterial, ADReferenceComponentFluxTerm]
    tests: [mandel_water_q2_q1_verification, mandel_water_q2_q1_jacobian]

  - id: mandel_discretization
    paper_equations: [eq:finite-element-spaces, eq:mandel-boundary-conditions]
    variables: [Q2 displacement, continuous Q1 water pressure, Q2 solid partial density]
    pressure_enrichment: false
    tests: [mandel_water_q2_q1_smoke, mandel_water_q2_q1_verification, mandel_water_q2_q1_jacobian]

  - id: poroplastic_return_mapping
    paper_equations: [eq:single-prime-kirchhoff-stress, eq:finite-plastic-stress-invariants, eq:dp-yield, eq:dp-flow, eq:dp-dissipation, eq:reconstruct-pore-allocation, eq:dp-yield-observable, eq:kuhn-tucker, eq:consistency-dot-f, eq:discrete-consistency]
    moose_objects: [ADDruckerPragerPoroplasticBiotMaterial]
    outputs: [plastic pore allocation a^p, plastic increment Delta_gamma, yield function f, mean effective pressure p', equivalent shear stress q', returned single-prime Kirchhoff stress]
    notes: rate-independent ideal Drucker-Prager radial return on tau' = P''F^T + (1-B)pJ I; inactive branch collapses to the elastic trial (a^p = 1, Delta_gamma = 0)
    tests: [poroplastic_delta_b_elastic, poroplastic_delta_b, poroplastic_delta_b_20, poroplastic_delta_b_30]

  - id: poroplastic_biot_correction
    paper_equations: [eq:finite-deformation-biot-coefficient, eq:general-implicit-biot-coefficient, eq:reconstruct-pore-allocation, eq:elastic-finite-deformation-biot-coefficient]
    moose_objects: [ADPoroplasticBiotCoefficientMaterial]
    output: B = 1 - (1 - B_el)/a^p from the fixed-pressure, fixed-history tangent with v = Jbar/a^p; Delta B = B - B_el
    tests: [poroplastic_delta_b_elastic, poroplastic_delta_b, poroplastic_delta_b_20, poroplastic_delta_b_30]

  - id: prescribed_deformation_helper
    paper_equations: [eq:skeleton-kinematics]
    moose_objects: [ADConstantDeformationGradientMaterial]
    role: single-element material-test helper prescribing a uniform diagonal F (test support only, not used in production solves)
    tests: []
