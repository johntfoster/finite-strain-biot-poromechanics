schema_version: 1
scope: single-solid single-water finite-deformation Biot coefficient
mappings:
- id: solid_kinematics
  paper_equations:
  - eq:skeleton-kinematics
  moose_objects:
  - ADSolidReferenceKinematics
  tests:
  - mandel_water_q2_q1_smoke
  - mandel_water_q2_q1_verification
- id: solid_spatial_mass_balance
  paper_equations:
  - eq:spatial-solid-mass-balance
  - eq:reference-solid-mass-balance
  - eq:solid-mass-weak-residual
  moose_objects:
  - ADBinarySolidSpatialMassMaterial
  - ADReferenceMaterialStorageRateTerm
  variables:
  - Q2 solid partial density stored in reference-normalized form
  tests:
  - mandel_water_q2_q1_smoke
  - mandel_water_q2_q1_bdf2
  - mandel_water_q2_q1_verification
  - mandel_water_q2_q1_jacobian
- id: local_mineral_state
  paper_equations:
  - eq:elastic-mineral-pressure
  - eq:solid-volume-fraction-relation
  - eq:verification-mineral-factors
  moose_objects:
  - ADLocalElasticMineralBiotMaterial
  outputs:
  - elastic intrinsic solid density stored in reference-normalized form
  - solid volume fraction
  - material rates
  - constraint residuals and partial derivatives
  - production state-only Biot coefficient
  - centered-difference diagnostic from perturbed mineral solves
  tests:
  - mandel_water_q2_q1_verification
  - mandel_water_q2_q1_jacobian
- id: matched_log_mineral_solver
  paper_equations:
  - eq:verification-mineral-factors
  - eq:trace-mineral-stability-domain
  source: moose_app/include/utils/MatchedLogMineralState.h
  consumers:
  - ADLocalElasticMineralBiotMaterial
  - ADVolumetricBarotropicSkeletonStressMaterial
  - ADImplicitPoroplasticBiotMaterial
  role: solve the scalar logarithmic mineral residual on its stable branch and retain
    first and nested second AD derivatives by Newton polishing after raw root bracketing
  configuration: solid reference; J for elastic states and Je for fixed plastic states
  tests:
  - mandel_water_q2_q1_jacobian
  - implicit_plastic_active_jacobian
  - implicit_plastic_consistency
- id: fixed_pressure_biot_tangent
  paper_equations:
  - eq:finite-deformation-biot-coefficient
  - eq:solid-density-eos-tangent
  - eq:poroplastic-biot-correction
  moose_objects:
  - ADConstrainedSkeletonBiotMaterial
  - ADLocalElasticMineralBiotMaterial
  production_output: ADLocalElasticMineralBiotMaterial supplies solid_biot_coefficient
    from the closed form evaluated at the matched logarithmic mineral state
  verification_oracle: ADConstrainedSkeletonBiotMaterial independently solves the
    dense AD-valued two-state tangent and supplies solid_biot_implicit_diagnostic
  tests:
  - mandel_water_q2_q1_verification
  - mandel_water_q2_q1_jacobian
- id: stress_and_momentum
  paper_equations:
  - eq:matched-logarithmic-double-prime-stress
  - eq:reference-momentum-balance
  - eq:momentum-weak-residual
  moose_objects:
  - ADVolumetricBarotropicSkeletonStressMaterial
  - ADReferenceSolidStressMaterial
  - ADReferenceSolidMomentum
  tests:
  - mandel_water_q2_q1_smoke
  - mandel_water_q2_q1_jacobian
- id: water_mass_balance
  paper_equations:
  - eq:reference-fluid-mass-balance
  - eq:barotropic-fluid-density
  - eq:fluid-pressure-weak-residual
  moose_objects:
  - ADBiotPressureStorageMaterial
  - ADReferenceMaterialStorageRateTerm
  time_discretization: AD time kernel using pressure, solid-volume-fraction, and displacement-gradient
    rates supplied by the selected MOOSE time integrator
  tests:
  - mandel_water_q2_q1_bdf2
  - mandel_water_q2_q1_verification
  - mandel_water_q2_q1_jacobian
- id: water_darcy_flux
  paper_equations:
  - eq:reference-darcy-flux
  - eq:fluid-pressure-weak-residual
  moose_objects:
  - ADBiotDarcyReferenceFluxMaterial
  - ADReferenceComponentFluxTerm
  tests:
  - mandel_water_q2_q1_verification
  - mandel_water_q2_q1_jacobian
- id: mandel_discretization
  paper_equations:
  - eq:finite-element-spaces
  - eq:mandel-boundary-conditions
  variables:
  - Q2 displacement
  - continuous Q1 water pressure
  - Q2 solid partial density
  pressure_enrichment: false
  tests:
  - mandel_water_q2_q1_smoke
  - mandel_water_q2_q1_verification
  - mandel_water_q2_q1_jacobian
- id: prescribed_deformation_helper
  paper_equations:
  - eq:skeleton-kinematics
  moose_objects:
  - ADConstantDeformationGradientMaterial
  role: Homogeneous AD axial deformation with optional superposed rotation for constitutive
    tests
  tests:
  - implicit_plastic_active_jacobian
  - implicit_plastic_consistency
- id: implicit_poroplastic_state
  paper_equations:
  - eq:plastic-isotropic-hardening
  - eq:plastic-accumulated-multiplier
  - eq:discrete-plastic-hardening
  - eq:distention-mineral-volumetric-energy
  - eq:coupled-skeleton-mineral-energy
  - eq:solid-volume-fraction-relation
  - eq:verification-mineral-factors
  - eq:poroplastic-biot-correction
  - eq:mandel-driving-stress
  - eq:plastic-exponential-update
  - eq:implicit-plastic-flow-increment
  - eq:discrete-consistency
  moose_objects:
  - ADImplicitPoroplasticBiotMaterial
  configuration: solid reference; symmetric flow in intermediate configuration
  inputs:
  - AD deformation gradient
  - AD pressure
  - previous plastic factor
  outputs:
  - current AD plastic and elastic factors
  - mineral density
  - solid volume fraction
  - state-only Biot coefficient at fixed current plastic state
  - single-prime Kirchhoff and total first Piola stresses
  assumptions:
  - isotropic energy
  - constant reference solid mass
  - smooth Drucker-Prager cone
  - nonassociated dilation
  - optional nonnegative linear isotropic hardening; no apex branch
  tests:
  - implicit_plastic_active_jacobian
  - implicit_plastic_consistency
  - implicit_plastic_hardening_jacobian
  - implicit_plastic_hardening_history
  - implicit_plastic_publication_history
- id: constitutive_verification_residuals
  paper_equations:
  - sec:weak-residuals-and-spaces
  moose_objects:
  - ADMaterialPropertyResidual
  - ADMaterialScalarL2Error
  role: algebraic AD material probes and spatial error norms
  tests:
  - implicit_plastic_active_jacobian
  - mandel_water_q2_q1_verification
- id: supplementary_fixed_history_examples
  paper_equations:
  - eq:verification-mineral-factors
  - eq:poroplastic-biot-correction
  - eq:distension
  moose_objects:
  - ADImplicitPoroplasticBiotMaterial
  - ADPlasticStateBiotMaterial
  - ADPoroplasticBiotCoefficientMaterial
  - ADConstrainedSkeletonBiotMaterial
  configuration: solid reference; mineral solve at Je=J/ap; coefficient derivative
    with respect to total J
  ad_expectations: current mineral states and coefficient retain AD; prescribed plastic
    history is held fixed in the two-state oracle
  tests:
  - poroplastic_delta_b
  - poroplastic_general_path
  - poroplastic_unload_tangent
  - poroplastic_b_feedback
  - poroplastic_tensorial_load_unload
- id: coupled_poroplastic_pore_volume
  paper_equations:
  - eq:poroplastic-mineral-volume-rate
  - eq:poroplastic-solid-fraction-rate
  - eq:discrete-plastic-distention-rate
  - eq:verification-mineral-factors
  - eq:plastic-exponential-update
  - eq:reference-fluid-mass-balance
  - eq:fluid-pressure-weak-residual
  moose_objects:
  - ADImplicitPoroplasticBiotMaterial
  - ADPoroplasticPoreVolumeMaterial
  - ADBiotPressureStorageMaterial
  - ADReferenceMaterialStorageRateTerm
  configuration: solid reference
  inputs: [Q2 displacement, Q1 pressure, Q2 solid partial density, plastic multiplier increment]
  ad_dependencies: current mineral state and exponential plastic increment retain outer AD derivatives
  time_discretization: backward Euler field rates; log plastic distention rate equals beta times the plastic multiplier increment divided by the step
  tests: [poroplastic_mandel_storage, poroplastic_mandel_refinement]
- id: poroplastic_spatial_stability
  paper_equations:
  - eq:plastic-isotropic-hardening
  - eq:poroplastic-loading-tangent
  - eq:poroplastic-acoustic-tensor
  moose_objects: [ADImplicitPoroplasticBiotMaterial]
  configuration: solid reference; Q2 displacement and Q1 pressure; active fixed-pressure tangent
  independent_diagnostic: validation/scripts/check_poroplastic_acoustic.py
  refinement_diagnostic: validation/scripts/check_poroplastic_spatial_stability.py
  assumptions:
  - synthetic dissipative isotropic hardening modulus 100 MPa
  - unchanged nonassociated flow direction
  - sampled in-plane acoustic tensors; no global stability or physical-validation claim
  tests: [implicit_plastic_hardening_jacobian, implicit_plastic_hardening_history, poroplastic_spatial_stability]
- id: drained_boundary_mass_reaction
  paper_equations: [eq:fluid-pressure-weak-residual]
  moose_objects: [NodalDofSum]
  inputs: [saved water storage and flux residuals on Q1 pressure nodes]
  configuration: solid reference
  role: sum boundary reaction degrees of freedom without counting Q2 midside interpolation values
  tests: [poroplastic_mandel_storage, poroplastic_mandel_refinement]
