schema_version: 1
scope: single-solid single-water finite-deformation Biot coefficient
mappings:
- id: optional_virgin_comparator
  paper_equations:
  - eq:verification-mineral-factors
  - eq:trace-mineral-stability-domain
  - eq:poroplastic-biot-correction
  moose_objects:
  - ADImplicitPoroplasticBiotMaterial
  configuration: fixed total deformation and isotropic initial plastic history
  inputs:
  - total Jacobian
  - pressure
  - plastic distention
  - mineral and skeleton moduli
  ad_expectations: optional diagnostics do not enter the production residual; available
    coefficients retain AD dependence
  diagnostic: unavailable virgin coefficient is NaN with plastic_elastic_biot_coefficient_available
    equal to zero
  tests:
  - virgin_comparator_domain
- id: solid_kinematics
  paper_equations:
  - eq:skeleton-kinematics
  moose_objects:
  - ADSolidReferenceKinematics
  tests:
  - mandel_water_q2_q1_smoke
  - mandel_water_q2_q1_verification
- id: solid_spatial_mass_balance
  paper_equations:
  - eq:spatial-solid-mass-balance
  - eq:reference-solid-mass-balance
  - eq:conservative-solid-density
  moose_objects:
  - ADBinarySolidSpatialMassMaterial
  variables:
  - Q2 displacement; density equals reference density divided by J
  tests:
  - mandel_water_q2_q1_smoke
  - mandel_water_q2_q1_conservative_step
  - mandel_water_q2_q1_verification
  - mandel_water_q2_q1_jacobian
- id: local_mineral_state
  paper_equations:
  - eq:elastic-mineral-pressure
  - eq:solid-volume-fraction-relation
  - eq:verification-mineral-factors
  moose_objects:
  - ADLocalElasticMineralBiotMaterial
  outputs:
  - elastic intrinsic solid density stored in reference-normalized form
  - solid volume fraction
  - material rates
  - constraint residuals and partial derivatives
  - production state-only Biot coefficient
  - centered-difference diagnostic from perturbed mineral solves
  tests:
  - mandel_water_q2_q1_verification
  - mandel_water_q2_q1_jacobian
- id: matched_log_mineral_solver
  paper_equations:
  - eq:verification-mineral-factors
  - eq:trace-mineral-stability-domain
  source: moose_app/include/utils/MatchedLogMineralState.h
  consumers:
  - ADLocalElasticMineralBiotMaterial
  - ADVolumetricBarotropicSkeletonStressMaterial
  - ADImplicitPoroplasticBiotMaterial
  - ADPlasticStateBiotMaterial
  - ADPoroplasticBiotCoefficientMaterial
  role: solve the scalar logarithmic mineral residual on its stable branch and retain
    first and nested second AD derivatives by Newton polishing after raw root bracketing
  bisection_stopping: stop when the log-volume interval width is at most four times
    machine epsilon times max(1, abs(lower), abs(upper)), or the midpoint equals an
    endpoint; retain a maximum of 100 iterations and three AD Newton updates
  configuration: solid reference; J for elastic states and Je for fixed plastic states
  tests:
  - mandel_water_q2_q1_jacobian
  - implicit_plastic_active_jacobian
  - implicit_plastic_consistency
- id: fixed_pressure_biot_tangent
  paper_equations:
  - eq:finite-deformation-biot-coefficient
  - eq:solid-density-eos-tangent
  - eq:poroplastic-biot-correction
  moose_objects:
  - ADConstrainedSkeletonBiotMaterial
  - ADLocalElasticMineralBiotMaterial
  production_output: ADLocalElasticMineralBiotMaterial supplies solid_biot_coefficient
    from the closed form evaluated at the matched logarithmic mineral state
  verification_oracle: ADConstrainedSkeletonBiotMaterial independently solves the
    dense AD-valued two-state tangent and supplies solid_biot_implicit_diagnostic
  tests:
  - mandel_water_q2_q1_verification
  - mandel_water_q2_q1_jacobian
- id: stress_and_momentum
  paper_equations:
  - eq:matched-logarithmic-double-prime-stress
  - eq:reference-momentum-balance
  - eq:momentum-weak-residual
  moose_objects:
  - ADVolumetricBarotropicSkeletonStressMaterial
  - ADReferenceSolidStressMaterial
  - ADReferenceBalanceState
  - ReferenceMomentum
  tests:
  - mandel_water_q2_q1_smoke
  - mandel_water_q2_q1_jacobian
- id: calibrated_stress_pressure_extension
  paper_equations:
  - eq:matched-logarithmic-double-prime-stress
  - eq:matched-logarithmic-single-prime-stress
  - eq:total-stress-pressure-tangent
  moose_objects:
  - ADImplicitPoroplasticBiotMaterial
  verifier: validation/scripts/check_implicit_poroplastic.py
  configuration: Kirchhoff stress per original reference volume; total Cauchy pressure
    tangent
  held_fixed: total deformation and current plastic configuration during pressure
    probes
  independent_checks: energy differences for both effective stresses; mineral-volume
    differences and pressure quadrature
  ad_expectations: current plastic-state derivatives remain active in the existing
    outer Jacobian tests
  tests:
  - implicit_plastic_consistency
  - implicit_plastic_publication_history
  - implicit_plastic_active_jacobian
  - implicit_plastic_hardening_jacobian
- id: water_mass_balance
  paper_equations:
  - eq:reference-fluid-mass-balance
  - eq:barotropic-fluid-density
  - eq:fluid-pressure-weak-residual
  - eq:conservative-fluid-mass-step
  moose_objects:
  - ADBiotPressureStorageMaterial
  - ADReferenceBalanceState
  - ReferenceFluidMass
  time_discretization: Backward Euler difference of complete current and previous
    quadrature-point water mass
  tests:
  - mandel_water_q2_q1_conservative_step
  - mandel_water_q2_q1_verification
  - mandel_water_q2_q1_jacobian
- id: water_darcy_flux
  paper_equations:
  - eq:reference-darcy-flux
  - eq:fluid-pressure-weak-residual
  moose_objects:
  - ADBiotDarcyReferenceFluxMaterial
  - ADReferenceBalanceState
  - ReferenceFluidMass
  tests:
  - mandel_water_q2_q1_verification
  - mandel_water_q2_q1_jacobian
- id: mandel_discretization
  paper_equations:
  - eq:finite-element-spaces
  - eq:mandel-boundary-conditions
  variables:
  - Q2 displacement
  - continuous Q1 water pressure
  pressure_enrichment: false
  tests:
  - mandel_water_q2_q1_smoke
  - mandel_water_q2_q1_verification
  - mandel_water_q2_q1_jacobian
- id: prescribed_deformation_helper
  paper_equations:
  - eq:skeleton-kinematics
  moose_objects:
  - ADConstantDeformationGradientMaterial
  role: Homogeneous AD axial deformation with optional superposed rotation for constitutive
    tests
  tests:
  - implicit_plastic_active_jacobian
  - implicit_plastic_consistency
- id: implicit_poroplastic_state
  paper_equations:
  - eq:plastic-isotropic-hardening
  - eq:plastic-accumulated-multiplier
  - eq:discrete-plastic-hardening
  - eq:distention-mineral-volumetric-energy
  - eq:coupled-skeleton-mineral-energy
  - eq:solid-volume-fraction-relation
  - eq:verification-mineral-factors
  - eq:poroplastic-biot-correction
  - eq:mandel-driving-stress
  - eq:plastic-exponential-update
  - eq:implicit-plastic-flow-increment
  - eq:discrete-consistency
  moose_objects:
  - ADImplicitPoroplasticBiotMaterial
  configuration: solid reference; symmetric flow in intermediate configuration
  inputs:
  - AD deformation gradient
  - AD pressure
  - previous plastic factor
  outputs:
  - current AD plastic and elastic factors
  - mineral density
  - solid volume fraction
  - state-only Biot coefficient at fixed current plastic state
  - single-prime Kirchhoff and total first Piola stresses
  assumptions:
  - isotropic energy
  - constant reference solid mass
  - smooth Drucker-Prager cone
  - nonassociated dilation
  - optional nonnegative linear isotropic hardening; no apex branch
  tests:
  - implicit_plastic_active_jacobian
  - implicit_plastic_consistency
  - implicit_plastic_hardening_jacobian
  - implicit_plastic_hardening_history
  - implicit_plastic_publication_history
- id: constitutive_verification_residuals
  paper_equations:
  - eq:verification-mineral-factors
  - eq:poroplastic-biot-correction
  - eq:single-prime-kirchhoff-stress
  - eq:distension
  - sec:weak-residuals-and-spaces
  moose_objects:
  - ADMaterialPropertyResidual
  - ADMaterialScalarL2Error
  role: algebraic AD material probes and spatial error norms
  tests:
  - implicit_plastic_active_jacobian
  - mandel_water_q2_q1_verification
- id: supplementary_fixed_history_examples
  paper_equations:
  - eq:verification-mineral-factors
  - eq:poroplastic-biot-correction
  - eq:distension
  moose_objects:
  - ADImplicitPoroplasticBiotMaterial
  - ADPlasticStateBiotMaterial
  - ADPoroplasticBiotCoefficientMaterial
  - ADConstrainedSkeletonBiotMaterial
  configuration: solid reference; mineral solve at Je=J/ap; coefficient derivative
    with respect to total J
  ad_expectations: current mineral states and coefficient retain AD; prescribed plastic
    history is held fixed in the two-state oracle
  tests:
  - poroplastic_delta_b
  - poroplastic_general_path
  - poroplastic_unload_tangent
  - poroplastic_b_feedback
  - poroplastic_tensorial_load_unload
- id: coupled_poroplastic_pore_volume
  paper_equations:
  - eq:verification-mineral-factors
  - eq:plastic-exponential-update
  - eq:reference-fluid-mass-balance
  - eq:fluid-pressure-weak-residual
  - eq:conservative-fluid-mass-step
  moose_objects:
  - ADImplicitPoroplasticBiotMaterial
  - ADPoroplasticPoreVolumeMaterial
  - ADBiotPressureStorageMaterial
  - ADReferenceBalanceState
  - ReferenceFluidMass
  configuration: solid reference
  inputs:
  - Q2 displacement
  - Q1 pressure
  - plastic history
  ad_dependencies: current mineral state and exponential plastic increment retain
    outer AD derivatives
  time_discretization: Backward Euler difference of full water mass at converged current
    plastic state
  tests:
  - poroplastic_mandel_storage
  - poroplastic_mandel_refinement
- id: poroplastic_spatial_stability
  paper_equations:
  - eq:plastic-isotropic-hardening
  - eq:poroplastic-loading-tangent
  - eq:poroplastic-acoustic-tensor
  moose_objects:
  - ADImplicitPoroplasticBiotMaterial
  configuration: solid reference; Q2 displacement and Q1 pressure; active fixed-pressure
    tangent
  independent_diagnostic: validation/scripts/check_poroplastic_acoustic.py
  refinement_diagnostic: validation/scripts/check_poroplastic_spatial_stability.py
  assumptions:
  - synthetic dissipative isotropic hardening modulus 100 MPa
  - unchanged nonassociated flow direction
  - sampled in-plane acoustic tensors; no global stability or physical-validation
    claim
  tests:
  - implicit_plastic_hardening_jacobian
  - implicit_plastic_hardening_history
  - poroplastic_spatial_stability
- id: drained_boundary_mass_reaction
  paper_equations:
  - eq:fluid-pressure-weak-residual
  moose_objects:
  - NodalDofSum
  inputs:
  - saved water storage and flux residuals on Q1 pressure nodes
  configuration: solid reference
  role: sum boundary reaction degrees of freedom without counting Q2 midside interpolation
    values
  tests:
  - poroplastic_mandel_storage
  - poroplastic_mandel_refinement
- id: conservative_initial_state
  paper_equations:
  - eq:conservative-solid-density
  - eq:conservative-fluid-mass-step
  moose_objects:
  - ADReferenceBalanceState
  - ReferenceFluidMass
  configuration: solid reference; nonzero deformation and pressure; prescribed plastic
    history
  role: initialize old fluid mass from actual initial fields without committing an
    extra plastic return
  tests:
  - mandel_water_q2_q1_conservative_step
  - poroplastic_initial_mass
  sources:
  - validation/scripts/check_conservative_initial_state.py
  - validation/scripts/check_conservative_plastic_initial_state.py
supporting_mappings:
- id: pressure_legendre_and_drained_stress_reduction
  paper_equations:
  - eq:total-stress-pressure-potential
  - eq:legendre-pressure-volume-conjugate
  - eq:legendre-mixed-pressure-deformation-derivative
  - eq:legendre-biot-pressure-tangent
  - eq:drained-double-prime-stress-definition
  - eq:drained-double-prime-stress-law
  - eq:finite-drained-pressure-multiplier
  - eq:double-prime-drained-pressure-split
  - eq:total-stress-drained-pressure-split
  - eq:single-prime-drained-pressure-split
  - eq:biot-tangent-finite-pressure-multiplier
  role: derivation
  sources:
  - paper/sections/finite_deformation_biot.tex
  - validation/scripts/check_stress_trace_derivation.py
  interpretation: Mixed derivatives of the pressure Legendre potential identify the
    reversible Biot coefficient. The drained stress and finite pressure multiplier
    rearrange the existing constitutive stresses without changing the implemented
    material law. Experimental interpretation requires reversible perturbations at
    fixed plastic state.
- id: motion_and_plastic_factorization
  paper_equations:
  - eq:inelastic-multiplicative-split
  - eq:inelastic-kinematic-splits
  - eq:aggregate-plastic-split
  role: constitutive_definition
  sources:
  - moose_app/src/materials/ADImplicitPoroplasticBiotMaterial.C
  - validation/scripts/check_implicit_poroplastic.py
  interpretation: The implementation stores Fp and Fe=F inverse(Fp); mineral volume
    is scalar. The spherical distention and isochoric true-plastic factors are reconstructed
    identities, not additional solved fields.
- id: energy_conjugates
  paper_equations:
  - eq:local-pressure-equilibrium
  - eq:intrinsic-pressure-free-energy
  - eq:pressure-legendre-potential
  - eq:single-prime-fixed-density-conjugate
  - eq:single-prime-energy-conjugate
  - eq:double-prime-energy-conjugate
  - eq:single-prime-first-piola-mineral-transform
  role: derivation
  sources:
  - moose_app/src/materials/ADImplicitPoroplasticBiotMaterial.C
  - validation/scripts/check_implicit_poroplastic.py
  - validation/scripts/check_stress_trace_derivation.py
  interpretation: Energy and Legendre derivatives establish the implemented mineral
    residual and effective stresses; the verifier differences both energies independently.
    No separate energy PDE is assembled.
- id: stress_transform
  paper_equations:
  - eq:single-double-prime-stress-relation
  - eq:total-cauchy-single-prime
  - eq:total-cauchy-stress
  role: implemented
  sources:
  - moose_app/src/materials/ADReferenceSolidStressMaterial.C
  - moose_app/src/materials/ADImplicitPoroplasticBiotMaterial.C
  interpretation: Elastic stress uses Pprime=Pdoubleprime+(1-B)p J FinvT and P=Pprime-p
    J FinvT; the plastic return uses the equivalent Kirchhoff transformation.
- id: volumetric_virtual_work
  paper_equations:
  - eq:elastic-logarithmic-volume-variation
  - eq:elastic-volume-variation-trace
  - eq:elastic-spherical-deformation-variation
  - eq:fixed-plastic-log-volume-variation
  - eq:elastic-volumetric-deformation-variation
  - eq:fixed-plastic-deformation-variation
  - eq:total-volumetric-deformation-variation
  - eq:elastic-shape-variation-expansion
  - eq:elastic-shape-variation-zero
  - eq:drained-energy-first-piola-work
  - eq:drained-energy-contraction-work
  - eq:drained-energy-volumetric-work
  - eq:drained-energy-cauchy-work
  - eq:drained-kirchhoff-volume-convention
  - eq:drained-logarithmic-energy-variation
  - eq:drained-logarithmic-energy-variation-result
  - eq:drained-volumetric-energy-derivative
  - eq:mineral-volumetric-reference-energy
  - eq:mineral-spherical-deformation-variation
  - eq:mineral-volumetric-deformation-variation
  - eq:mineral-volumetric-stress-work
  - eq:mineral-volumetric-work-substitution
  - eq:mineral-volumetric-work-trace
  - eq:mineral-logarithmic-energy-variation
  - eq:logarithmic-mineral-energy-derivative
  - eq:matched-logarithmic-mineral-stress
  - eq:constitutive-phase-stress-sum
  - eq:constitutive-single-prime-phase-substitution
  - eq:constitutive-single-prime-phase-stress
  - eq:constitutive-single-prime-phase-trace
  - eq:constitutive-kirchhoff-intrinsic-stress-trace
  - eq:constitutive-kirchhoff-mineral-substitution
  - eq:constitutive-kirchhoff-solid-mass-substitution
  - eq:constitutive-single-prime-mineral-trace
  - eq:coupled-volume-energy-work
  - eq:distention-mineral-energy-work
  role: derivation
  sources:
  - validation/scripts/check_stress_trace_derivation.py
  - moose_app/src/materials/ADVolumetricBarotropicSkeletonStressMaterial.C
  interpretation: Virtual-work and mineral-stress identities derive the energy closure.
    They are supporting analytical steps, not additional numerical equations or independent
    state variables.
- id: matched_energy_reduction
  paper_equations:
  - eq:drained-mineral-volume-matching
  - eq:drained-distention-volume-matching
  - eq:distention-mineral-volumetric-energy
  - eq:matched-energy-density-derivative
  - eq:constitutive-characteristic-volume-relation
  role: derivation
  sources:
  - validation/scripts/check_stress_trace_derivation.py
  - validation/scripts/check_implicit_poroplastic.py
  - moose_app/include/utils/MatchedLogMineralState.h
  interpretation: Drained matching and energy differentiation reduce to the scalar
    mineral residual. The helper solves the reduced residual; the verifiers reconstruct
    the energy independently.
- id: equivalent_biot_forms
  paper_equations:
  - eq:solid-pressure-implicit-tangent
  - eq:biot-solid-volume-fraction-form
  - eq:biot-porosity-form
  role: verification
  sources:
  - validation/scripts/check_stress_trace_biot_fraction.py
  - moose_app/src/materials/ADConstrainedSkeletonBiotMaterial.C
  - moose_app/include/utils/MatchedLogMineralState.h
  interpretation: Alternative forms are algebraically equivalent to the production
    mineral-volume expression. The independent two-state tangent holds referential
    mass and plastic history fixed.
- id: effective_stress_reconstruction
  paper_equations:
  - eq:single-prime-stress-from-energy
  - eq:matched-logarithmic-single-prime-stress
  - eq:double-prime-cauchy-push-forward
  - eq:matched-logarithmic-double-prime-cauchy-stress
  role: implemented
  sources:
  - moose_app/src/materials/ADVolumetricBarotropicSkeletonStressMaterial.C
  - moose_app/src/materials/ADImplicitPoroplasticBiotMaterial.C
  - validation/scripts/check_implicit_poroplastic.py
  interpretation: The code evaluates the equivalent double-prime pressure correction
    K alpha p^2 z^2/(Ks D), then adds the single-prime correction. Here z is mineral
    volume and D=Ks+alpha p z; the verifier checks the energy derivatives.
- id: small_strain_limit
  paper_equations:
  - eq:biot-limit-infinitesimal-strain
  - eq:biot-limit-logarithmic-volume
  - eq:biot-limit-isochoric-strain
  - eq:biot-limit-effective-stress
  - eq:biot-limit-total-stress
  role: limiting_case
  sources:
  - validation/scripts/check_mandel_implicit_biot.py
  - moose_app/src/materials/ADVolumetricBarotropicSkeletonStressMaterial.C
  interpretation: These linearizations define the analytical comparison, while the
    application retains finite-deformation kinematics and stress.
- id: plastic_driving_stress_and_admissibility
  paper_equations:
  - eq:kirchhoff-stress-definition
  - eq:single-prime-kirchhoff-stress
  - eq:complete-mandel-driving-stress
  - eq:mandel-driving-stress
  - eq:finite-plastic-stress-invariants
  - eq:dp-yield-observable
  - eq:dp-flow
  - eq:plastic-complementarity
  - eq:plastic-isotropic-hardening
  - eq:plastic-accumulated-multiplier
  - eq:reconstruct-pore-allocation
  - eq:plastic-power
  - eq:plastic-dissipation-on-yield
  role: implemented
  sources:
  - moose_app/src/materials/ADImplicitPoroplasticBiotMaterial.C
  - validation/scripts/check_implicit_poroplastic.py
  - validation/scripts/check_poroplastic_hardening.py
  interpretation: M=Fe^T tauprime Fe^-T supplies compressive mean stress and q. The
    smooth-cone return enforces flow, current cohesion and consistency; the verifier
    checks dissipation. True-plastic volume preservation follows from reconstructing
    Fp/ap^(1/3).
- id: mandel_geometry_and_boundaries
  paper_equations:
  - eq:mandel-quarter-domain
  - eq:mandel-boundary-conditions
  - eq:mandel-symmetry-boundaries
  - eq:mandel-fluid-boundaries
  role: input_deck
  sources:
  - moose_app/test/tests/mandel_implicit_biot/mandel_water_q2_q1.i
  - validation/scripts/check_mandel_implicit_biot.py
  - scripts/reproduce_mandel_publication.py
  interpretation: The rectangular mesh, symmetry displacement constraints, right pressure
    Dirichlet condition and prescribed analytical top displacement specify the reported
    test; remaining flux boundaries are natural zero flux.
- id: drained_volume_limit
  paper_equations:
  - eq:drained-elastic-biot-volume
  - eq:drained-elastic-biot-parameters
  role: limiting_case
  sources:
  - validation/scripts/check_stress_trace_biot_fraction.py
  - moose_app/include/utils/MatchedLogMineralState.h
  interpretation: At p=0 and ap=1 the scalar mineral root is a power of J; the symbolic
    verifier checks the resulting drained coefficient reduction.
- id: analytical_mandel_reference
  paper_equations:
  - eq:trace-mineral-pressure-tangent
  - eq:mandel-linearized-pore-volume-rate
  - eq:mandel-linearized-water-balance
  - eq:mandel-derived-parameters
  - eq:mandel-storage-modulus
  - eq:mandel-undrained-bulk-modulus
  - eq:mandel-skempton-coefficient
  - eq:mandel-poisson-ratios
  - eq:mandel-consolidation-coefficient
  - eq:classical-biot-storage-comparison
  - eq:mandel-root-equation
  - eq:mandel-pressure-series
  - eq:mandel-displacement-series
  - eq:mandel-horizontal-displacement-series
  - eq:mandel-vertical-displacement-series
  role: analytical_reference
  sources:
  - validation/scripts/check_mandel_implicit_biot.py
  - scripts/reproduce_mandel_publication.py
  - moose_app/src/materials/ADBiotPressureStorageMaterial.C
  - moose_app/src/materials/ADLocalElasticMineralBiotMaterial.C
  interpretation: The pressure derivative and linearized pore-volume rate give the
    storage modulus used by parameters(); mandel_roots(), analytical_solution() and
    analytical_displacement() implement the series. Source comment identifiers also
    name unnumbered displays and equation groups. These are reference calculations,
    not extra MOOSE kernels.
- id: gajo_logarithmic_elastic_equivalence
  paper_equations:
  - eq:gajo-plastic-skeleton-stress
  - eq:gajo-plastic-mineral-factorization
  - eq:gajo-plastic-contact-compression
  - eq:gajo-plastic-pressure-compression
  - eq:gajo-plastic-eliminated-stress
  - eq:gajo-plastic-volume-stress-elimination
  - eq:gajo-plastic-volume-pressure-elimination
  - eq:gajo-plastic-scalar-mineral-closure
  - eq:gajo-plastic-total-mean-stress
  - eq:gajo-plastic-drained-mean-stress
  - eq:gajo-plastic-mineral-pressure-tangent
  - eq:gajo-plastic-finite-tangent-relation
  - eq:gajo-plastic-biot-tangent-reduction
  role: derivation
  sources:
  - paper/sections/gajo_equivalence_appendix.tex
  - references/notes/finite-strain-pressure-coupling-literature-2026-09-18.md
  interpretation: Elimination of the cited logarithmic elastic factor relations recovers
    the scalar mineral closure. Reconstruction establishes the reverse implication
    on a common admissible branch. Differentiating the mean total stress recovers
    the fixed-pressure mineral-volume coefficient and distinguishes it from the finite
    pressure multiplier relative to the drained stress. These are supporting algebraic
    relations, not additional implemented equations. The appendix also maps the volumetric
    closure of Gajo's 2011 plastic specialization with reversible mineral volume change;
    equivalence of complete flow and hardening laws is not asserted.
