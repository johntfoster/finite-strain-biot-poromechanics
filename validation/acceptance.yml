schema_version: 1
study: finite-deformation solid-water spatial-mass and fixed-pressure Biot verification
evidence_class: implementation_verification_and_analytical_benchmark
entries:
- id: optional_virgin_comparator
  governing_reduction: an admissible plastic mineral state does not require an admissible virgin comparator
  observables: [production coefficient, comparator availability, explicit unavailable value, required-companion rejection]
  authoritative_reference: paper/sections/finite_deformation_biot.tex
  tolerance: plastic coefficient error <= 1e-10; unavailable coefficient is NaN and availability is zero; required companion rejects the state
  result: validation/scripts/check_comparator_domain.py
  status: pass
- id: ad_time_integrator_storage
  governing_reduction: chain-rule time derivatives of the pulled-back solid and water
    accumulations
  variables:
  - displacement
  - water pressure
  - solid partial density
  observables:
  - transient solves with backward Euler and BDF2
  - solid reference-mass drift
  authoritative_reference: paper/sections/implicit_ad_implementation.tex
  tolerance: backward-Euler and BDF2 smoke solves succeed; solid reference-mass drift
    L2 <= 1.0e-9
  result: moose_app/test/tests/mandel_implicit_biot/tests
  status: pass
- id: local_elastic_tangent
  governing_reduction: production closed-form coefficient from the matched logarithmic
    mineral state, independently checked by general AD-valued implicit differentiation
    of the material-mass and mineral-EOS residuals at fixed pore pressure and fixed
    referential solid mass J rho_s
  variables:
  - solid-reference Jacobian
  - solid partial density
  - water pressure
  observables:
  - production closed-form versus general constrained-material Biot error
  - centered-difference Biot error
  - solid reference-mass drift
  - mineral-EOS residual
  authoritative_reference: paper/sections/finite_deformation_biot.tex
  tolerance: Biot identity and mineral-EOS residual L2 <= 1.0e-12; solid reference-mass
    drift L2 <= 1.0e-9
  result: validation/mandel_implicit_biot.yml
  status: pass
- id: outer_ad_jacobian
  governing_reduction: transient Q2 displacement, Q1 pressure, and Q2 solid partial-density
    residual with momentum, solid storage, water storage, and Darcy transport
  variables:
  - displacement
  - water pressure
  - solid partial density
  observables:
  - PETSc AD-to-finite-difference Jacobian ratio at each Newton state
  authoritative_reference: moose_app/test/tests/mandel_implicit_biot/implicit_biot_q2_q1_jacobian.i
  tolerance: ratio <= 1.0e-7
  result: moose_app/test/tests/mandel_implicit_biot/tests
  status: pass
- id: mandel_pressure_and_displacement
  governing_reduction: water-filled plane-strain Mandel consolidation obtained by
    linearizing the spatial solid partial-density balance, local mineral EOS, and
    exact J(1-phi_s)rho_f(p) balance
  variables:
  - Q2 displacement
  - Q1 water pressure
  - Q2 solid partial density
  observables:
  - spatial pressure profiles
  - spatial displacement profiles
  - Mandel-Cryer pressure maximum
  - applied load
  - exact reference-water accumulation
  authoritative_reference: Cheng-Detournay analytical Mandel series
  tolerance: pressure scale error <= 4.0e-2; side displacement error <= 8.0e-3; load
    error <= 3.0e-3
  result: validation/mandel_implicit_biot.yml
  status: pass
- id: finite_deformation_continuation
  governing_reduction: ten-percent platen-compression continuation of the solid-water
    problem
  variables:
  - displacement
  - water pressure
  - solid intrinsic density
  - solid volume fraction
  observables:
  - Biot coefficient departure
  - two-dimensional Biot field
  - two-dimensional solid-density field
  - mesh and time sensitivity
  - temporal decay of the referential-mass L2 diagnostic
  authoritative_reference: exact implicit-Biot identity evaluated along the solved
    path
  tolerance: Biot identity and mineral-EOS residual L2 <= 1.0e-12; solid reference-mass
    L2 drift decreases when the backward-Euler step is halved; mesh and time sensitivity
    metrics are reported
  result: validation/mandel_large_deformation.csv
  status: pass
- id: implicit_poroplastic_consistency
  publication_parameters: initial cohesion 20 MPa; isotropic hardening modulus 100 MPa; reference solid fraction 0.8
  feedback_loading: axial stretch 0.65; final pressure 0 to 1 GPa; both transformations retain admissible solid volume fractions and pass endpoint load-step refinement
  governing_reduction: matched logarithmic mineral state at Je=J/a_p with a closed-form
    fixed-current-plastic-state coefficient; implicit exponential flow and yield consistency
  observables:
  - physical mass
  - mineral EOS
  - centered fixed-state Biot tangent
  - energy-derived stress
  - drained double-prime calibration and finite-pressure energy extension
  - relations between double-prime, single-prime and total stress
  - fixed-plastic-state pressure tangent and pressure integral
  - matrix-logarithm flow
  - determinant increment
  - yield
  - dissipation
  - objectivity
  - increment refinement
  authoritative_reference: paper/sections/finite_deformation_biot.tex
  tolerance: mass and EOS <= 1e-10; Biot <= 5e-8; flow and determinant <= 1e-9; normalized
    yield <= 1e-9; normalized stress, drained stress, double-prime stress, stress transformations,
    pressure integral and dimensionless pressure tangent <= 2e-7; normalized objectivity <= 1e-10
  result: validation/implicit_poroplastic_verification.json
  status: pass
- id: implicit_poroplastic_outer_ad
  governing_reduction: active material residuals with stress invariants, plastic distention
    and Biot coefficient
  observables:
  - PETSc relative and absolute Jacobian differences
  authoritative_reference: moose_app/test/tests/implicit_poroplastic/active_jacobian.i
  tolerance: ratio <= 1e-7 and difference <= 1e-5
  result: moose_app/test/tests/implicit_poroplastic/tests
  status: pass
- id: implicit_poroplastic_hardening
  governing_reduction: dissipative isotropic hardening inside the implicit nonassociated return
  observables:
  - independently accumulated plastic multiplier and current yield strength
  - elastic unloading and renewed plastic loading
  - mass, mineral EOS, exponential flow, fixed-history coefficient and energy-derived stress
  - outer AD Jacobian at positive hardening modulus
  authoritative_reference: paper/sections/finite_deformation_biot.tex
  tolerance: existing material-point tolerances unchanged; accumulated multiplier error <= 1e-10; PETSc ratio <= 1e-7 and difference <= 1e-5
  result: validation/scripts/check_poroplastic_hardening.py; moose_app/test/tests/implicit_poroplastic/tests
  status: pass
- id: coupled_poroplastic_storage
  governing_reduction: mineral and pore-volume rates including the evolving exponential plastic increment in the reference water balance
  observables:
  - centered differences of complete water accumulation with independently solved mineral states
  - fixed-history Biot coefficient and same-state elastic comparator
  - assembled momentum, solid mass, water storage, and Darcy Jacobian through compression and hold
  - recovery of the existing elastic pressure, displacement, and coefficient with yielding suppressed
  authoritative_reference: paper/sections/implicit_ad_implementation.tex
  tolerance: normalized storage-rate error <= 2e-7; Biot error <= 5e-8; PETSc ratio <= 1e-7 and difference <= 1e-5; normalized elastic-recovery field errors <= 1e-7
  result: validation/poroplastic_mandel_verification.json
  status: pass
- id: coupled_poroplastic_refinement
  governing_reduction: ten-percent axial compression and hold with active plastic pore-volume evolution
  observables:
  - water-mass change versus integrated Darcy outflow and pressure-boundary reaction
  - temporal refinement of chain-rule water-mass drift and solid-mass drift
  - spatial and temporal sensitivity of averages and local coefficient differences
  authoritative_reference: paper/sections/mandel_verification.tex
  tolerance: finest-run Darcy mass mismatch <= 1 percent of initial water mass; water reaction and chain-rule drift and solid-mass drift decrease under temporal refinement; mineral EOS L2 <= 1e-10
  result: validation/poroplastic_mandel_verification.json
  status: pass
  limitations: synthetic hardening modulus; no experimental validation or global constitutive stability proof is claimed
- id: poroplastic_spatial_stability
  governing_reduction: fixed-pressure active acoustic tangent and spatial response under dissipative isotropic hardening
  observables:
  - acoustic determinant sign change in the zero-hardening control
  - positive sampled acoustic determinants on corrected coarse, fine and half-time-step paths
  - transverse field variation and spatial second differences
  - fine-grid temporal difference of the coefficient contrast
  authoritative_reference: paper/sections/mandel_verification.tex
  tolerance: transverse RMS delta B <= 1e-8; positive sampled acoustic determinants; fine-grid temporal maximum delta B difference <= 5e-6; fine/coarse final second-difference RMS ratio <= 0.6
  result: validation/poroplastic_spatial_stability.json
  status: pass
supplementary_entries:
- id: poroplastic_b_feedback
  governing_reduction: Implicit exponential return during simultaneous axial compression
    and pressure ramp; coefficient from the mineral equation and fixed-history closed
    form enters the driving stress. A virgin-coefficient companion isolates pressure
    feedback.
  variables:
  - uniform prescribed axial compression
  - uniform pore pressure
  observables:
  - corrected coefficient B
  - elastic coefficient B_el
  - coupled and frozen-elastic plastic pore allocation and increment
  authoritative_reference: paper/sections/finite_deformation_biot.tex; paper/sections/poroplastic_results.tex
  tolerance: B > B_el and a^p <= a_p_ref within 1e-9 for supported smooth-cone states;
    the independently identified tensile-apex state must be rejected by the MOOSE solve
  result: moose_app/test/tests/poroplastic_biot/tests (poroplastic_b_feedback), validation/poroplastic_b_feedback.csv,
    validation/scripts/check_poroplastic_b_feedback.py
  status: pass
  evidence_status: supplementary_implementation_verification
- id: poroplastic_general_path
  governing_reduction: Mass-conserving two-state tangent at fixed pressure and plastic
    distention, with the mineral state solved at Je=J/ap. Compare the dense AD tangent,
    closed coefficient, and independently run implicit loading state.
  variables:
  - uniform prescribed axial compression
  - drained pore pressure
  - frozen canonical plastic pore allocation
  observables:
  - general-path coefficient B_general
  - reduced coefficient B_reduced from eq:poroplastic-biot-correction
  - elastic coefficient B_el
  - plastic pore allocation a^p
  authoritative_reference: paper/sections/finite_deformation_biot.tex; paper/sections/poroplastic_results.tex
  tolerance: '|B_general - B_reduced| <= 1.0e-9 over the drained compression sweep
    (machine precision); both equal the stateful-engine coefficient (|B_reduced -
    B_stateful| <= 1.0e-6)'
  result: validation/poroplastic_general_path.csv, validation/scripts/check_poroplastic_general_path.py
  status: pass
  evidence_status: supplementary_implementation_verification
- id: poroplastic_unload_branch
  governing_reduction: Freeze the distention measured at 20 percent compression; solve
    mineral equilibrium and the two-state tangent at each unloading volume.
  variables:
  - uniform prescribed axial compression (unload)
  - frozen canonical plastic pore allocation
  observables:
  - unload coefficient B_unload
  - virgin elastic B_el
  - monotonic-load coefficient
  - frozen a^p
  authoritative_reference: paper/sections/finite_deformation_biot.tex; paper/sections/poroplastic_results.tex
  tolerance: B_unload agrees with the independent scalar solve and closed form at
    the frozen peak to CSV precision; B_unload > B_el at every unload compression
  result: validation/poroplastic_load_unload.csv, validation/scripts/check_poroplastic_load_unload.py
  status: pass
  evidence_status: supplementary_implementation_verification
- id: poroplastic_tensorial_load_unload
  governing_reduction: Implicit multiplicative exponential return with the current
    mineral state, coefficient, and Mandel driving stress through loading, unloading
    and reloading.
  variables:
  - uniform prescribed axial stretch (load 0 to 20%
  - unload to 10%
  - reload to 20%)
  - drained pore pressure
  observables:
  - plastic pore allocation a^p = det(F^p)
  - plastic increment Delta_gamma
  - coefficient B from eq:poroplastic-biot-correction
  authoritative_reference: paper/sections/finite_deformation_biot.tex; paper/sections/poroplastic_results.tex
  tolerance: loading produces Delta_gamma > 0 and a^p > 1; on the unload branch Delta_gamma
    = 0 and a^p is frozen at the peak (immediate elastic reversal) to CSV precision;
    reloading re-yields at the stored peak; the elastic-limit variant (M = 100) collapses
    to a^p = 1, Delta_gamma = 0, B = B_el; the peak a^p is path independent as the
    step is refined
  result: validation/tensorial_load_unload.csv, validation/scripts/check_tensorial_load_unload.py,
    moose_app/test/tests/poroplastic_biot/tests (poroplastic_tensorial_load_unload)
  status: pass
  evidence_status: supplementary_implementation_verification
