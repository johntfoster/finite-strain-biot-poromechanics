schema_version: 1
study: finite-deformation solid-water spatial-mass and fixed-pressure Biot verification
evidence_class: implementation_verification_and_analytical_benchmark

entries:
  - id: ad_time_integrator_storage
    governing_reduction: chain-rule time derivatives of the pulled-back solid and water accumulations
    variables: [displacement, water pressure, solid partial density]
    observables: [transient solves with backward Euler and BDF2, solid reference-mass drift]
    authoritative_reference: paper/sections/finite_deformation_biot.tex
    tolerance: backward-Euler and BDF2 smoke solves succeed; solid reference-mass drift L2 <= 1.0e-9
    result: moose_app/test/tests/mandel_implicit_biot/tests
    status: pass

  - id: local_elastic_tangent
    governing_reduction: general AD-valued implicit differentiation of the local material-mass and elastic mineral-EOS residuals at fixed intrinsic phase pressure and fixed referential solid mass J rho_s, with the elastic closed form used only as an oracle
    variables: [solid-reference Jacobian, solid partial density, water pressure]
    observables: [general constrained-material versus elastic-oracle Biot error, centered-difference Biot error, solid reference-mass drift, mineral-EOS residual]
    authoritative_reference: paper/sections/finite_deformation_biot.tex
    tolerance: Biot identity and mineral-EOS residual L2 <= 1.0e-12; solid reference-mass drift L2 <= 1.0e-9
    result: validation/mandel_implicit_biot.yml
    status: pass

  - id: outer_ad_jacobian
    governing_reduction: transient Q2 displacement, Q1 pressure, and Q2 solid partial-density residual with momentum, solid storage, water storage, and Darcy transport
    variables: [displacement, water pressure, solid partial density]
    observables: [PETSc AD-to-finite-difference Jacobian ratio at each Newton state]
    authoritative_reference: moose_app/test/tests/mandel_implicit_biot/implicit_biot_q2_q1_jacobian.i
    tolerance: ratio <= 1.0e-7
    result: moose_app/test/tests/mandel_implicit_biot/tests
    status: pass

  - id: mandel_pressure_and_displacement
    governing_reduction: water-filled plane-strain Mandel consolidation obtained by linearizing the spatial solid partial-density balance, local mineral EOS, and exact J(1-phi_s)rho_f(p) balance
    variables: [Q2 displacement, Q1 water pressure, Q2 solid partial density]
    observables: [spatial pressure profiles, spatial displacement profiles, Mandel-Cryer pressure maximum, applied load, exact reference-water accumulation]
    authoritative_reference: Cheng-Detournay analytical Mandel series
    tolerance: pressure scale error <= 4.0e-2; side displacement error <= 8.0e-3; load error <= 3.0e-3
    result: validation/mandel_implicit_biot.yml
    status: pass

  - id: finite_deformation_continuation
    governing_reduction: ten-percent platen-compression continuation of the solid-water problem
    variables: [displacement, water pressure, solid intrinsic density, solid volume fraction]
    observables: [Biot coefficient departure, two-dimensional Biot field, two-dimensional solid-density field, mesh and time sensitivity, temporal decay of the referential-mass L2 diagnostic]
    authoritative_reference: exact implicit-Biot identity evaluated along the solved path
    tolerance: Biot identity and mineral-EOS residual L2 <= 1.0e-12; solid reference-mass L2 drift decreases when the backward-Euler step is halved; mesh and time sensitivity metrics are reported
    result: validation/mandel_large_deformation.csv
    status: pass
